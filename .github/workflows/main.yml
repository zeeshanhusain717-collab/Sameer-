name: Build Sameer Ansari Calculator APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate Build Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/sameeransari/retailcalculator
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SameerCalculator"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.sameeransari.retailcalculator"
              compileSdk 34
              defaultConfig {
                  applicationId "com.sameeransari.retailcalculator"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose true }
              composeOptions { kotlinCompilerExtensionVersion "1.5.8" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.1"
              implementation "androidx.activity:activity-compose:1.9.0"
              implementation platform("androidx.compose:compose-bom:2024.05.00")
              implementation "androidx.compose.ui:ui"
              implementation "androidx.compose.ui:ui-graphics"
              implementation "androidx.compose.ui:ui-tooling-preview"
              implementation "androidx.compose.material3:material3"
          }
          EOF

      - name: Generate App Resources & Manifest
        run: |
          set -euo pipefail

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Sameer Ansari Calculator</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M19,3H5C3.89,3 3,3.89 3,5v14c0,1.1 0.89,2 2,2h14c1.1,0 2,-0.9 2,-2V5C21,3.89 20.1,3 19,3zM19,19H5V5h14V19z"/>
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Write MainActivity.kt (Citizen Style Commercial & Weight Calculator)
        run: |
          cat > app/src/main/java/com/sameeransari/retailcalculator/MainActivity.kt <<'EOF'
          package com.sameeransari.retailcalculator

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlin.math.sqrt

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      SameerCalculatorTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = Color(0xFF0F172A)
                          ) {
                              CitizenCalculatorScreen()
                          }
                      }
                  }
              }
          }

          @Composable
          fun SameerCalculatorTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Color(0xFF38BDF8),
                      background = Color(0xFF0F172A),
                      surface = Color(0xFF1E293B)
                  ),
                  content = content
              )
          }

          @Composable
          fun CitizenCalculatorScreen() {
              var displayValue by remember { mutableStateOf("0") }
              var subInfoText by remember { mutableStateOf("Sameer Ansari App") }
              var currentMode by remember { mutableStateOf("calc") } // "calc" or "weight"

              // Calculator States
              var firstOperand by remember { mutableStateOf<Double?>(null) }
              var pendingOperator by remember { mutableStateOf<String?>(null) }
              var waitingForOperand by remember { mutableStateOf(false) }
              var memoryGrandTotal by remember { mutableStateOf(0.0) }
              var memoryValue by remember { mutableStateOf(0.0) }

              // Weight / Rate Calculator Inputs
              var rateInput by remember { mutableStateOf("") }
              var weightInput by remember { mutableStateOf("") }

              fun appendDigit(digit: String) {
                  if (waitingForOperand) {
                      displayValue = digit
                      waitingForOperand = false
                  } else {
                      displayValue = if (displayValue == "0" && digit != ".") digit else displayValue + digit
                  }
              }

              fun performOperation(op: String) {
                  val inputValue = displayValue.toDoubleOrNull() ?: 0.0
                  if (firstOperand == null) {
                      firstOperand = inputValue
                  } else if (pendingOperator != null) {
                      val result = when (pendingOperator) {
                          "+" -> firstOperand!! + inputValue
                          "-" -> firstOperand!! - inputValue
                          "×" -> firstOperand!! * inputValue
                          "÷" -> if (inputValue != 0.0) firstOperand!! / inputValue else 0.0
                          else -> inputValue
                      }
                      firstOperand = result
                      displayValue = result.toString().removeSuffix(".0")
                  }
                  pendingOperator = op
                  waitingForOperand = true
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(8.dp),
                  verticalArrangement = Arrangement.SpaceBetween
              ) {
                  // Top Brand Banner Header
                  Card(
                      shape = RoundedCornerShape(12.dp),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1B4B)),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(
                          modifier = Modifier.padding(10.dp).fillMaxWidth(),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text(
                              text = "SAMEER ANSARI",
                              fontSize = 20.sp,
                              fontWeight = FontWeight.ExtraBold,
                              color = Color(0xFFF59E0B)
                          )
                          Text(
                              text = "कमर्शियल व ग्राम-किलो कैलकुलेटर (100% ऑफ़लाइन)",
                              fontSize = 10.sp,
                              color = Color(0xFF94A3B8)
                          )
                      }
                  }

                  // Mode Switcher Buttons (Calc vs Weight)
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .background(Color(0xFF0B1120), RoundedCornerShape(8.dp))
                          .padding(4.dp),
                      horizontalArrangement = Arrangement.SpaceEvenly
                  ) {
                      Button(
                          onClick = { currentMode = "calc" },
                          colors = ButtonDefaults.buttonColors(
                              containerColor = if (currentMode == "calc") Color(0xFF334155) else Color.Transparent
                          ),
                          modifier = Modifier.weight(1f)
                      ) {
                          Text("मूल कैलकुलेटर", fontSize = 12.sp, color = if (currentMode == "calc") Color(0xFF38BDF8) else Color.Gray)
                      }
                      Button(
                          onClick = { currentMode = "weight" },
                          colors = ButtonDefaults.buttonColors(
                              containerColor = if (currentMode == "weight") Color(0xFF334155) else Color.Transparent
                          ),
                          modifier = Modifier.weight(1f)
                      ) {
                          Text("किलो/ग्राम हिसाब", fontSize = 12.sp, color = if (currentMode == "weight") Color(0xFF38BDF8) else Color.Gray)
                      }
                  }

                  // Citizen Style Green Screen Display
                  Card(
                      shape = RoundedCornerShape(14.dp),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF1B4D3E)),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(14.dp),
                          horizontalAlignment = Alignment.End
                      ) {
                          Text(
                              text = subInfoText,
                              fontSize = 11.sp,
                              fontWeight = FontWeight.Bold,
                              color = Color(0xFF86EFAC)
                          )
                          Spacer(modifier = Modifier.height(4.dp))
                          Text(
                              text = displayValue,
                              fontSize = 38.sp,
                              fontWeight = FontWeight.Bold,
                              color = Color(0xFFD1FAE5),
                              maxLines = 1
                          )
                      }
                  }

                  // Main Content: Either Weight Mode Inputs or Citizen Keypad
                  if (currentMode == "weight") {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(Color(0xFF1E293B), RoundedCornerShape(14.dp))
                              .padding(14.dp),
                          verticalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          Text("दुकानदार ग्राम-किलो रेट ट्रांसलेटर", fontWeight = FontWeight.Bold, color = Color(0xFFF59E0B), fontSize = 14.sp)
                          OutlinedTextField(
                              value = rateInput,
                              onValueChange = { 
                                  rateInput = it
                                  val r = it.toDoubleOrNull() ?: 0.0
                                  val w = weightInput.toDoubleOrNull() ?: 0.0
                                  displayValue = "₹ " + String.format("%.2f", (r * w) / 1000.0)
                              },
                              label = { Text("1 Kg का भाव (₹)") },
                              modifier = Modifier.fillMaxWidth(),
                              singleLine = true
                          )
                          OutlinedTextField(
                              value = weightInput,
                              onValueChange = { 
                                  weightInput = it
                                  val r = rateInput.toDoubleOrNull() ?: 0.0
                                  val w = it.toDoubleOrNull() ?: 0.0
                                  displayValue = "₹ " + String.format("%.2f", (r * w) / 1000.0)
                              },
                              label = { Text("मात्रा ग्राम में (जैसे 250, 500)") },
                              modifier = Modifier.fillMaxWidth(),
                              singleLine = true
                          )
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                              Button(onClick = { weightInput = "100"; val r = rateInput.toDoubleOrNull() ?: 0.0; displayValue = "₹ " + String.format("%.2f", (r * 100) / 1000.0) }) { Text("100g") }
                              Button(onClick = { weightInput = "250"; val r = rateInput.toDoubleOrNull() ?: 0.0; displayValue = "₹ " + String.format("%.2f", (r * 250) / 1000.0) }) { Text("250g") }
                              Button(onClick = { weightInput = "500"; val r = rateInput.toDoubleOrNull() ?: 0.0; displayValue = "₹ " + String.format("%.2f", (r * 500) / 1000.0) }) { Text("500g") }
                              Button(onClick = { weightInput = "1000"; val r = rateInput.toDoubleOrNull() ?: 0.0; displayValue = "₹ " + String.format("%.2f", (r * 1000) / 1000.0) }) { Text("1kg") }
                          }
                      }
                  } else {
                      // Citizen Calculator Keypad Grid (Exact layout from image)
                      Column(
                          verticalArrangement = Arrangement.spacedBy(5.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          // Row 1: ON/AC, %, ÷
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(5.dp)) {
                              CalcBtn("ON/AC", Modifier.weight(1f), Color(0xFF0D9488)) { displayValue = "0"; firstOperand = null; pendingOperator = null; subInfoText = "Cleared" }
                              CalcBtn("CHECK", Modifier.weight(1f), Color(0xFF0284C7)) { subInfoText = "Check Log Active" }
                              CalcBtn("CORRECT", Modifier.weight(1f), Color(0xFF0284C7)) { 
                                  displayValue = if (displayValue.length > 1) displayValue.dropLast(1) else "0"
                              }
                              CalcBtn("÷", Modifier.weight(1f), Color(0xFF475569)) { performOperation("÷") }
                          }
                          // Row 2: GT, MU, %, ×
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(5.dp)) {
                              CalcBtn("GT", Modifier.weight(1f), Color(0xFF334155)) { displayValue = memoryGrandTotal.toString(); subInfoText = "Grand Total" }
                              CalcBtn("MU", Modifier.weight(1f), Color(0xFF334155)) { 
                                  val v = displayValue.toDoubleOrNull() ?: 0.0
                                  displayValue = (v * 1.15).toString()
                                  subInfoText = "+15% Markup Added"
                              }
                              CalcBtn("%", Modifier.weight(1f), Color(0xFF334155)) { 
                                  val v = displayValue.toDoubleOrNull() ?: 0.0
                                  displayValue = (v / 100.0).toString()
                              }
                              CalcBtn("×", Modifier.weight(1f), Color(0xFF475569)) { performOperation("×") }
                          }
                          // Row 3: 7, 8, 9, -
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(5.dp)) {
                              CalcBtn("7", Modifier.weight(1f), Color(0xFF334155)) { appendDigit("7") }
                              CalcBtn("8", Modifier.weight(1f), Color(0xFF334155)) { appendDigit("8") }
                              CalcBtn("9", Modifier.weight(1f), Color(0xFF334155)) { appendDigit("9") }
                              CalcBtn("-", Modifier.weight(1f), Color(0xFF475569)) { performOperation("-") }
                          }
                          // Row 4: 4, 5, 6, +
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(5.dp)) {
                              CalcBtn("4", Modifier.weight(1f), Color(0xFF334155)) { appendDigit("4") }
                              CalcBtn("5", Modifier.weight(1f), Color(0xFF334155)) { appendDigit("5") }
                              CalcBtn("6", Modifier.weight(1f), Color(0xFF334155)) { appendDigit("6") }
                              CalcBtn("+", Modifier.weight(1f), Color(0xFF475569)) { performOperation("+") }
                          }
                          // Row 5: 1, 2, 3, =
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(5.dp)) {
                              CalcBtn("1", Modifier.weight(1f), Color(0xFF334155)) { appendDigit("1") }
                              CalcBtn("2", Modifier.weight(1f), Color(0xFF334155)) { appendDigit("2") }
                              CalcBtn("3", Modifier.weight(1f), Color(0xFF334155)) { appendDigit("3") }
                              CalcBtn("=", Modifier.weight(1f), Color(0xFF2563EB)) { 
                                  performOperation("=")
                                  val res = displayValue.toDoubleOrNull() ?: 0.0
                                  memoryGrandTotal += res
                                  subInfoText = "Saved to GT"
                              }
                          }
                          // Row 6: 0, 00, ., √, M+, M-
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(5.dp)) {
                              CalcBtn("0", Modifier.weight(1f), Color(0xFF334155)) { appendDigit("0") }
                              CalcBtn("00", Modifier.weight(1f), Color(0xFF334155)) { appendDigit("00") }
                              CalcBtn(".", Modifier.weight(1f), Color(0xFF334155)) { appendDigit(".") }
                              CalcBtn("√", Modifier.weight(1f), Color(0xFF475569)) { 
                                  val v = displayValue.toDoubleOrNull() ?: 0.0
                                  if(v >= 0) displayValue = sqrt(v).toString()
                              }
                              CalcBtn("M+", Modifier.weight(1f), Color(0xFF475569)) { 
                                  memoryValue += displayValue.toDoubleOrNull() ?: 0.0
                                  subInfoText = "Added to Memory"
                              }
                              CalcBtn("M-", Modifier.weight(1f), Color(0xFF475569)) { 
                                  memoryValue -= displayValue.toDoubleOrNull() ?: 0.0
                                  subInfoText = "Subtracted Memory"
                              }
                          }
                      }
                  }

                  // Footer Ribbon
                  Card(
                      shape = RoundedCornerShape(10.dp),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF312E81)),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(8.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text("Sameer Ansari Edition", fontSize = 12.sp, fontWeight = FontWeight.Bold, color = Color(0xFFF59E0B))
                          Text("100% Offline Smooth", fontSize = 10.sp, color = Color(0xFF34D399))
                      }
                  }
              }
          }

          @Composable
          fun CalcBtn(label: String, modifier: Modifier, bgColor: Color, onClick: () -> Unit) {
              Button(
                  onClick = onClick,
                  colors = ButtonDefaults.buttonColors(containerColor = bgColor),
                  shape = RoundedCornerShape(8.dp),
                  modifier = modifier.height(48.dp),
                  contentPadding = PaddingValues(0.dp)
              ) {
                  Text(label, fontSize = 15.sp, fontWeight = FontWeight.Bold, color = Color.White)
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sameer-Ansari-Citizen-Calculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
